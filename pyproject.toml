[project]
name = "golli"
version = "0.1.0"
description = "O'zbek tilidagi futbol Telegram boti"
requires-python = ">=3.12"
dependencies = [
    "aiogram[redis]>=3.34,<4",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "asyncpg>=0.32",
    "alembic>=1.20",
    "pydantic-settings>=2.16",
    "fluent.runtime>=0.4",
    "httpx>=0.28",
    "pillow>=11",
    "tzdata>=2026.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.5",
    "fakeredis>=2.41",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/golli"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001-003 lotin harfiga o'xshash kirill harflarini xato deb biladi; loyihada ruscha matn bor.
ignore = ["RUF001", "RUF002", "RUF003"]
