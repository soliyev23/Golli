<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}Golli admin{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f7fb; --surface: #ffffff; --surface-2: #f8fafc; --text: #0f172a; --muted: #64748b;
  --faint: #94a3b8; --border: #e6eaf1; --border-strong: #d6dce6;
  --brand: #16a34a; --brand-2: #22c55e; --brand-soft: #e8f8ee;
  --tg: #229ed9; --tg-soft: #e6f4fb; --ig: #e1306c; --ig-soft: #fdebf1;
  --violet: #7c3aed; --violet-soft: #f1ebfe; --amber: #d97706; --amber-soft: #fdf3e2;
  --danger: #dc2626; --danger-soft: #fdecec;
  --shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 4px 16px rgba(15, 23, 42, .04);
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0a0e14; --surface: #111722; --surface-2: #0d131c; --text: #e6ebf2; --muted: #93a1b5;
    --faint: #64748b; --border: #1e2735; --border-strong: #2a3546;
    --brand-soft: #0f2a1a; --tg-soft: #0c2533; --ig-soft: #33121f; --violet-soft: #22163d;
    --amber-soft: #2e2210; --danger-soft: #331414; --shadow: none;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-feature-settings: "tnum" 1, "cv11" 1; }
a { color: inherit; }

/* Sarlavha */
header { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: saturate(160%) blur(10px); border-bottom: 1px solid var(--border); }
.bar { max-width: 1320px; margin: 0 auto; padding: 0 24px; height: 60px; display: flex; gap: 28px; align-items: center; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; text-decoration: none; letter-spacing: -.2px; }
.brand-mark { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-size: 16px;
  background: linear-gradient(135deg, var(--brand-2), var(--brand)); color: #fff; box-shadow: 0 4px 12px rgba(22,163,74,.3); }
nav { display: flex; gap: 4px; height: 100%; }
nav a { display: flex; align-items: center; padding: 0 12px; text-decoration: none; color: var(--muted); font-weight: 500;
  border-bottom: 2px solid transparent; margin-bottom: -1px; }
nav a:hover { color: var(--text); }
nav a.on { color: var(--text); border-bottom-color: var(--brand); }
.spacer { flex: 1; }
.who { display: flex; align-items: center; gap: 10px; color: var(--muted); }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--border);
  display: grid; place-items: center; font-weight: 600; color: var(--text); text-transform: uppercase; font-size: 12px; }

main { max-width: 1320px; margin: 0 auto; padding: 28px 24px 56px; }
.page-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
h1 { font-size: 22px; line-height: 1.2; margin: 0; letter-spacing: -.4px; }
.subtitle { color: var(--muted); margin: 4px 0 0; }
h2 { font-size: 15px; margin: 0; letter-spacing: -.1px; }
.muted { color: var(--muted); }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px 0; }
.card-body { padding: 16px 20px 20px; }

/* Boshqaruv elementlari */
input, select, button { font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--border-strong);
  border-radius: 10px; padding: 8px 12px; outline: none; transition: border-color .15s, box-shadow .15s; }
input:focus, select:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
button, .btn { cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
  font-weight: 500; border: 1px solid var(--border-strong); border-radius: 10px; padding: 8px 14px; background: var(--surface); }
button:hover, .btn:hover { background: var(--surface-2); }
.btn-primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
.btn-primary:hover { background: #15803d; }
.btn-ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn-danger { color: var(--danger); }
.btn-danger:hover { background: var(--danger-soft); border-color: var(--danger-soft); }

.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.ok { background: var(--brand-soft); color: var(--brand); }
.bad { background: var(--danger-soft); color: var(--danger); }
.chip { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; }
.src-telegram { background: var(--tg-soft); color: var(--tg); }
.src-instagram { background: var(--ig-soft); color: var(--ig); }
.src-other { background: var(--violet-soft); color: var(--violet); }
.src-none { background: var(--surface-2); color: var(--muted); }

/* Jadval */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: separate; border-spacing: 0; }
th, td { text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--border); white-space: nowrap; vertical-align: middle; }
th { color: var(--muted); font-weight: 600; font-size: 12px; background: var(--surface-2); position: sticky; top: 0; }
th:first-child { border-top-left-radius: 10px; } th:last-child { border-top-right-radius: 10px; }
tbody tr { transition: background .1s; }
tbody tr:hover { background: var(--surface-2); }
tbody tr:last-child td { border-bottom: 0; }
td.wrap { white-space: normal; min-width: 180px; max-width: 280px; }
.cell-main { font-weight: 500; }
.cell-sub { color: var(--muted); font-size: 12px; }
code { background: var(--surface-2); border: 1px solid var(--border); padding: 3px 8px; border-radius: 8px; font-size: 12.5px; }

.alert { padding: 12px 14px; border-radius: 10px; margin-bottom: 16px; font-weight: 500; }
.error { background: var(--danger-soft); color: var(--danger); }
.success { background: var(--brand-soft); color: var(--brand); }

select { max-width: 100%; }
main > *, .card { min-width: 0; }
@media (max-width: 760px) {
  .bar { padding: 0 12px; gap: 8px; }
  .brand { font-size: 0; gap: 0; }
  nav a { padding: 0 8px; font-size: 13px; }
  .who > span { display: none; }
  .who button { padding: 6px 8px; }
  main { padding: 20px 14px 40px; }
  .page-head { flex-direction: column; align-items: start; }
}
</style>
{% block head %}{% endblock %}
</head>
<body>
{% if admin %}
<header>
  <div class="bar">
    <a class="brand" href="/"><span class="brand-mark">⚽</span>Golli</a>
    <nav>
      <a href="/" class="{{ 'on' if request.url.path == '/' }}">Foydalanuvchilar</a>
      <a href="/links" class="{{ 'on' if request.url.path == '/links' }}">Havolalar</a>
    </nav>
    <span class="spacer"></span>
    <div class="who">
      <span>{{ admin }}</span>
      <span class="avatar">{{ admin[:1] }}</span>
      <form method="post" action="/logout">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <button type="submit" class="btn-ghost">Chiqish</button>
      </form>
    </div>
  </div>
</header>
{% endif %}
<main>{% block content %}{% endblock %}</main>
</body>
</html>
